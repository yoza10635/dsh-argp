name: Release

# tag 驱动发布：push v* 标签 → 校验 → 自动生成 GitHub Release
# Release 正文取自 CHANGELOG.md 里 `## [<tag 去 v 前缀>]` 的整段（awk 精确子串匹配；
# 注意 `## [1.7.0]` 不是 `## [1.7.0-beta.3]` 的子串，故 beta tag 抽自己那段、正式 tag 抽正式段）；
# 抽不到对应段才回退 GitHub 自动摘要。早期用过的 release-notes-<tag>.md 手工正文机制**已废弃**。
# npm 侧（`npm publish`）由维护者手动执行——不发在 CI 里，避免 NPM_TOKEN 成为自动化的攻击面。
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Quality gate
        run: npm run check

      - name: Build lib/
        run: npm run build

      # 发布前强制产物一致：lib/ 必须是当前 src/ 的真实产物
      - name: Verify lib/ is in sync with src/
        run: git diff --exit-code lib/

      # 正文取自 CHANGELOG.md 里对应版本的整段（tag 去 v 前缀）；release-notes-*.md 已废弃。
      # 抽不到对应段才回退 GitHub 自动摘要。创建走 softprops/action-gh-release 的默认
      # GITHUB_TOKEN（permissions: contents:write 即可建+改 release），CI 里不放 PAT。
      - name: Build release body from CHANGELOG
        id: body
        run: |
          VER="${GITHUB_REF_NAME#v}"
          awk -v ver="## [$VER]" '/^## \[/ { if (seen) exit; if (index($0, ver) > 0) seen=1 } seen { print }' CHANGELOG.md > release-body.md
          if [ -s release-body.md ]; then
            echo "path=release-body.md" >> "$GITHUB_OUTPUT"
            echo "release body = CHANGELOG [$VER] section ($(wc -c < release-body.md) bytes)"
          else
            echo "path=" >> "$GITHUB_OUTPUT"
            echo "no CHANGELOG section for [$VER]; falling back to generated notes"
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          body_path: ${{ steps.body.outputs.path }}
          generate_release_notes: ${{ steps.body.outputs.path == '' }}
