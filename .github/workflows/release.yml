name: Release

# tag 驱动发布：push v* 标签 → 校验 → 自动生成 GitHub Release
# Release 正文优先取仓库内的 release-notes-<tag>.md（手工撰写），缺失时回退 GitHub 自动摘要。
# npm 侧（`npm publish`）由维护者手动执行——不发在 CI 里，避免 NPM_TOKEN 成为自动化的攻击面。
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Quality gate
        run: npm run check

      - name: Build lib/
        run: npm run build

      # 发布前强制产物一致：lib/ 必须是当前 src/ 的真实产物
      - name: Verify lib/ is in sync with src/
        run: git diff --exit-code lib/

      # 手工撰写的发布说明（release-notes-v1.1.0.md 这种）优先；没有就让 GitHub 生成摘要
      - name: Resolve release notes
        id: notes
        run: |
          NOTES="release-notes-${GITHUB_REF_NAME}.md"
          if [ -f "$NOTES" ]; then
            echo "path=$NOTES" >> "$GITHUB_OUTPUT"
            echo "using hand-written notes: $NOTES"
          else
            echo "path=" >> "$GITHUB_OUTPUT"
            echo "no $NOTES; falling back to generated notes"
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          body_path: ${{ steps.notes.outputs.path }}
          generate_release_notes: ${{ steps.notes.outputs.path == '' }}
