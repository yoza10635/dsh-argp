# ARGP dsh 声明式挂载示例（P4）
# 用法：在 dsh cordis snapshot 中 include 本文件，或按此结构 patch。
# 注意：patch 是顶层字段浅替换；要禁用 compaction-basic，需要显式 disabled: true。
#
# 预算比例驱动（默认，无需硬编码）：
#   windowTokens = 适配器声明的 contextWindow × windowRatio（默认 0.8，即上下文的 80%）
#   retainTokens = windowTokens × retainRatio（默认 0.2，即压缩率 1/5）
# 上下文容量由模型适配器（其他插件）声明提供，本引擎不硬编码；下面不写 window/retain
# 即为全比例模式。如需显式覆盖，取消注释 windowTokens/retainTokens。
include:
  - id: compaction-basic
    package: '@deepseek-ai/dsh-compaction-basic'
    disabled: true
  - id: dsh-argp
    package: 'dsh-argp'
    config:
      maxPasses: 16
      reserveTokens: 0
      # windowTokens: 160000      # 可选：显式覆盖触发线
      # retainTokens: 32000       # 可选：显式覆盖保留目标（须 < windowTokens）
